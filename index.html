<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Distance Detector</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: #0f1115;
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 22px;
        text-align: center;
        transition: background 0.3s ease;
      }
      body.too-close {
        background: #8b0000;
      }
      body.good-distance {
        background: #006400;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 26px;
      }
      p.note {
        margin: 0;
        opacity: 0.75;
        font-size: 14px;
        max-width: 520px;
        line-height: 1.55;
      }
      button {
        font-size: 17px;
        padding: 11px 22px;
        border: 0;
        border-radius: 12px;
        background: #ff4a1c;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #cam canvas {
        border-radius: 12px;
      }
      #label {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        opacity: 0.8;
        min-height: 18px;
      }
      #stage {
        width: min(92vw, 520px);
        min-height: 220px;
        border-radius: 16px;
        border: 1px solid #23262e;
        display: grid;
        place-items: center;
        padding: 20px;
        overflow: hidden;
        transition: background 0.12s ease;
      }
      #stage .big {
        font-size: 42px;
        font-weight: 800;
        color: #fff;
        line-height: 1.1;
      }
      .hint {
        opacity: 0.4;
      }
      [hidden] {
        display: none !important;
      }
      .status-badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 14px;
        margin-top: 10px;
      }
      .status-too-close {
        background: #ff4a1c;
        color: white;
      }
      .status-good-distance {
        background: #00c851;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>📏 Detektor Jarak Layar</h1>
    <p class="note">
      Klik Mulai dan izinkan akses kamera. Posisikan diri Anda pada jarak
      berbeda dari layar. Sistem akan mendeteksi apakah Anda
      <b>Terlalu Dekat</b> atau pada <b>Jarak Baik</b>.
    </p>
    <button id="startBtn">▶ Mulai Kamera</button>
    <div id="cam"></div>
    <div id="label">belum berjalan</div>
    <div id="stage">
      <span class="hint" id="hint">Status deteksi akan muncul di sini</span>
      <div class="big" id="statusText" hidden></div>
      <div class="status-badge" id="statusBadge" hidden></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script>
      // Konfigurasi deteksi jarak layar
      const MODEL_URL =
        "https://teachablemachine.withgoogle.com/models/S75C_fwK3/";

      // Nama class untuk deteksi
      const CLASS_TOO_CLOSE = "Too Close";
      const CLASS_GOOD_DISTANCE = "Good Distance";

      const CONFIDENCE_THRESHOLD = 0.85;
      const COOLDOWN_MS = 1000;
      /* ===================================================================== */

      // Variabel global
      let model, webcam; // Model AI & instance webcam
      let isRunning = false; // Flag apakah deteksi sedang berjalan
      let lastStatus = null; // Status terakhir: "too-close", "good-distance", atau null
      let lastChangeTime = 0; // Timestamp perubahan status terakhir (untuk cooldown)
      let audioContext = null; // Web Audio API context untuk suara

      // Ambil elemen DOM
      const stage = document.getElementById("stage"); // Area tampilan status utama
      const hint = document.getElementById("hint"); // Text petunjuk awal
      const statusText = document.getElementById("statusText"); // Text status besar (⚠️/✅)
      const statusBadge = document.getElementById("statusBadge"); // Badge status kecil
      const label = document.getElementById("label"); // Label prediksi + confidence
      const body = document.body; // Body untuk ganti background

      // Inisialisasi AudioContext
      function initAudio() {
        if (!audioContext) {
          // Buat AudioContext (prefix webkit untuk Safari lama)
          audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }
        // Browser suspend AudioContext otomatis sampai ada interaksi user
        if (audioContext.state === "suspended") {
          audioContext.resume();
        }
      }

      // Suara peringatan
      function playWarningSound() {
        try {
          initAudio();
          const oscillator = audioContext.createOscillator(); // Generator nada
          const gain = audioContext.createGain(); // Kontrol volume

          oscillator.type = "sawtooth"; // Gelombang bergerigi = suara kasar/peringatan
          oscillator.frequency.value = 220; // Nada A3 (rendah)
          oscillator.connect(gain);
          gain.connect(audioContext.destination); // Ke speaker

          // Envelope: Attack cepat -> Sustain -> Release cepat
          const now = audioContext.currentTime;
          gain.gain.setValueAtTime(0.001, now); // Mulai dari diam
          gain.gain.exponentialRampToValueAtTime(0.3, now + 0.02); // Naik cepat (attack)
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5); // Turun pelan (release)

          oscillator.start(now);
          oscillator.stop(now + 0.55); // Durasi ~0.55 detik
        } catch (e) {
          console.warn("Gagal mainkan suara peringatan:", e);
        }
      }

      // Suara jarak aman
      function playTingSound() {
        try {
          initAudio();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "sine"; // Gelombang sinus = suara murni/halus
          oscillator.frequency.value = 880; // Nada A5 (tinggi, seperti "ting")
          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          // Envelope sangat cepat: "ting" singkat
          const now = audioContext.currentTime;
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.2, now + 0.01); // Attack super cepat
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); // Release cepat

          oscillator.start(now);
          oscillator.stop(now + 0.16); // Durasi ~0.16 detik
        } catch (e) {
          console.warn("Gagal mainkan suara ting:", e);
        }
      }

      // Update UI berdasarkan prediksi model
      function updateUI(status, confidence) {
        const now = Date.now();

        // COOLDOWN: Cegah perubahan status terlalu cepat (flickering)
        if (now - lastChangeTime < COOLDOWN_MS) {
          return; // Masih dalam jeda, abaikan update ini
        }

        // Tentukan status baru berdasarkan prediksi model
        let newStatus = null;
        if (status === CLASS_TOO_CLOSE && confidence >= CONFIDENCE_THRESHOLD) {
          newStatus = "too-close";
        } else if (
          status === CLASS_GOOD_DISTANCE &&
          confidence >= CONFIDENCE_THRESHOLD
        ) {
          newStatus = "good-distance";
        }
        // Jika confidence < threshold, newStatus tetap null (netral)

        // Hanya update UI jika status benar-benar berubah
        if (newStatus !== lastStatus) {
          lastStatus = newStatus;
          lastChangeTime = now;

          // Reset semua tampilan ke default
          body.classList.remove("too-close", "good-distance");
          hint.hidden = true;
          statusText.hidden = true;
          statusBadge.hidden = true;

          if (newStatus === "too-close") {
            // ===== TERLALU DEKAT: Background merah + suara peringatan =====
            body.classList.add("too-close");
            stage.style.background = "#8B0000";
            statusText.hidden = false;
            statusText.textContent = "⚠️ TERLALU DEKAT";
            statusBadge.hidden = false;
            statusBadge.textContent = "TERLALU DEKAT";
            statusBadge.className = "status-badge status-too-close";
            playWarningSound();
          } else if (newStatus === "good-distance") {
            // ===== JARAK BAIK: Background hijau + suara ting =====
            body.classList.add("good-distance");
            stage.style.background = "#006400";
            statusText.hidden = false;
            statusText.textContent = "✅ JARAK BAIK";
            statusBadge.hidden = false;
            statusBadge.textContent = "JARAK BAIK";
            statusBadge.className = "status-badge status-good-distance";
            playTingSound();
          } else {
            // ===== NETRAL: Belum ada deteksi yakin =====
            stage.style.background = "";
            hint.hidden = false;
            hint.textContent = "Posisikan diri Anda di depan kamera...";
          }
        }

        // Selalu update label prediksi real-time (class + persentase)
        label.textContent = `${status} - ${(confidence * 100).toFixed(1)}%`;
      }

      // Mulai deteksi
      document.getElementById("startBtn").onclick = async function start() {
        initAudio(); // Inisialisasi audio saat user klik (wajib browser policy)

        label.textContent = "memuat model...";
        try {
          // Load model dari Teachable Machine (model.json + metadata.json)
          model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json",
          );
        } catch (e) {
          label.textContent = "❌ Gagal memuat model. Cek MODEL_URL di kode.";
          console.error(e);
          return;
        }

        // Buat webcam: lebar 200px, tinggi 200px, flip horizontal (mirror)
        webcam = new tmImage.Webcam(200, 200, true);
        await webcam.setup(); // Minta izin akses kamera
        await webcam.play(); // Mulai streaming video
        document.getElementById("cam").appendChild(webcam.canvas); // Tampilkan ke halaman

        document.getElementById("startBtn").disabled = true; // Nonaktifkan tombol
        label.textContent = "berjalan! Maju/mundur dari layar.";
        isRunning = true;
        requestAnimationFrame(loop); // Mulai loop prediksi
      };

      // Loop prediksi
      async function loop() {
        if (!isRunning) return;
        webcam.update(); // Ambil frame terbaru dari webcam
        await predict(); // Jalankan prediksi
        requestAnimationFrame(loop); // Jadwalkan frame berikutnya
      }

      // Fungsi inferensi model
      async function predict() {
        // Jalankan inferensi model pada canvas webcam
        const predictions = await model.predict(webcam.canvas);

        // Cari prediksi dengan probabilitas tertinggi
        let top = predictions[0];
        for (const p of predictions) {
          if (p.probability > top.probability) top = p;
        }

        // Kirim hasil ke fungsi update UI
        updateUI(top.className, top.probability);
      }
    </script>
  </body>
</html>
